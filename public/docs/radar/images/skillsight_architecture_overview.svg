<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="bgTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="980" height="560" fill="#f8fafc"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">SkillSight：减去"共享描述背景"的技能检索校准</text>
  <text x="490" y="56" text-anchor="middle" font-size="12" fill="#64748b">问题：低IDF通用Token构成背景子空间，系统性污染稠密检索排名</text>

  <!-- 输入：技能库 / 查询 -->
  <g>
    <rect x="30" y="110" width="150" height="90" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">技能库 + 查询</text>
    <text x="105" y="162" text-anchor="middle" font-size="11" fill="#475569">稠密嵌入 e(q) / e(d)</text>
    <text x="105" y="180" text-anchor="middle" font-size="11" fill="#475569">词项 Token t</text>
  </g>

  <!-- 背景子空间 -->
  <g>
    <rect x="230" y="110" width="180" height="90" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="320" y="138" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">背景子空间 B</text>
    <text x="320" y="158" text-anchor="middle" font-size="11" fill="#92400e">大津法选低IDF通用Token</text>
    <text x="320" y="176" text-anchor="middle" font-size="11" fill="#92400e">语料均值 → SVD 取前 r 左奇异向量</text>
    <text x="320" y="194" text-anchor="middle" font-size="11" fill="#92400e">投影能量 = "背景对齐"</text>
  </g>

  <!-- 双通道 -->
  <text x="690" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">两条互补校准通道</text>

  <!-- SBC 语义通道 -->
  <g>
    <rect x="470" y="110" width="230" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="585" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">SBC 语义背景校准</text>
    <text x="585" y="155" text-anchor="middle" font-size="11" fill="#1e40af">e 投影到 B 的正交补空间</text>
    <text x="585" y="173" text-anchor="middle" font-size="11" fill="#1e40af">丢弃背景对齐项，仅留残余对齐</text>
    <text x="585" y="191" text-anchor="middle" font-size="11" fill="#1e40af">投影后不重新归一化 → 套话自动降权</text>
  </g>

  <!-- LEC 词汇通道 -->
  <g>
    <rect x="730" y="110" width="220" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="840" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#065f46">LEC 词汇证据校准</text>
    <text x="840" y="155" text-anchor="middle" font-size="11" fill="#065f46">文档普遍性折扣</text>
    <text x="840" y="173" text-anchor="middle" font-size="11" fill="#065f46">w(t) = idf(t)·(1-p(t))^β</text>
    <text x="840" y="191" text-anchor="middle" font-size="11" fill="#065f46">精确命中 + 候选集 z-score 归一</text>
  </g>

  <!-- 连线：输入 -> 背景 / 双通道 -->
  <line x1="180" y1="155" x2="228" y2="155" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="410" y1="150" x2="468" y2="150" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="410" y1="160" x2="728" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="4 3"/>

  <!-- 校准得分汇合 -->
  <g>
    <rect x="340" y="290" width="300" height="76" rx="12" fill="#1e293b"/>
    <text x="490" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">校准后得分 = SBC(语义) + LEC(词汇, 非负截断)</text>
    <text x="490" y="342" text-anchor="middle" font-size="12" fill="#cbd5e1">背景贡献被双重剥离，残余对齐恢复区分力</text>
  </g>
  <line x1="585" y1="200" x2="430" y2="288" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="840" y1="200" x2="560" y2="288" stroke="#10b981" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 结果 -->
  <g>
    <rect x="250" y="430" width="480" height="90" rx="12" fill="#fff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="490" y="458" text-anchor="middle" font-size="14" font-weight="700" fill="#3730a3">结果：训练无关 · 不加模型 · 比 Dense+Reranker 快 677–1248 倍</text>
    <text x="490" y="482" text-anchor="middle" font-size="12" fill="#475569">Recall@10：66.02 → 86.23（+20.21pp）</text>
    <text x="490" y="502" text-anchor="middle" font-size="12" fill="#475569">跨三种嵌入模型稳定提分，端到端最高 +4.97pp</text>
  </g>
  <line x1="490" y1="366" x2="490" y2="428" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>
